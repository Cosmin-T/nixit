<h1>nixit pacman repository</h1>
<p>Add to <code>/etc/pacman.conf</code>:</p>
<pre>[nixit]
Server = https://cosmin-t.github.io/nixit/x86_64</pre>
<p>Then: <code>sudo pacman -Syu</code> and <code>sudo pacman -S nixit</code>.</p>
<p>Source: <a href="https://github.com/Cosmin-T/nixit">github.com/Cosmin-T/nixit</a></p>
</body>
